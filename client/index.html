<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="12" fill="#6366f1"/>
          <path d="M8 12h24v16a4 4 0 01-4 4H12a4 4 0 01-4-4V12z" fill="white" fill-opacity=".9"/>
          <circle cx="14" cy="20" r="2" fill="#6366f1"/>
          <circle cx="20" cy="20" r="2" fill="#6366f1"/>
          <circle cx="26" cy="20" r="2" fill="#6366f1"/>
          <path d="M20 8l4 4H16l4-4z" fill="white" fill-opacity=".9"/>
        </svg>
        <span>ChatApp</span>
      </div>
      <h2>Welcome</h2>
      <p class="subtitle">Enter your name and pick a room to start chatting</p>
      <div class="form-group">
        <label>Your Name</label>
        <input id="username-input" type="text" placeholder="e.g. Alice" maxlength="30" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>Room</label>
        <div class="room-input-row">
          <input id="room-input" type="text" placeholder="General" maxlength="50" autocomplete="off" />
          <button id="rooms-btn" title="Browse rooms">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </button>
        </div>
        <div id="rooms-dropdown" class="rooms-dropdown hidden"></div>
      </div>
      <button id="join-btn" class="btn-primary">Join Chat</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo small">
          <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="12" fill="#6366f1"/>
            <path d="M8 12h24v16a4 4 0 01-4 4H12a4 4 0 01-4-4V12z" fill="white" fill-opacity=".9"/>
            <circle cx="14" cy="20" r="2" fill="#6366f1"/>
            <circle cx="20" cy="20" r="2" fill="#6366f1"/>
            <circle cx="26" cy="20" r="2" fill="#6366f1"/>
            <path d="M20 8l4 4H16l4-4z" fill="white" fill-opacity=".9"/>
          </svg>
          <span>ChatApp</span>
        </div>
        <button id="leave-btn" title="Leave room">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="room-info">
        <div class="room-name-label">Room</div>
        <div id="current-room-name" class="room-name">#general</div>
      </div>

      <div class="members-section">
        <div class="section-title">Members <span id="member-count">0</span></div>
        <ul id="members-list"></ul>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="sidebar-toggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-room">
          <span id="header-room-name">#general</span>
          <span id="header-member-count" class="member-badge">0 members</span>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div id="typing-indicator" class="typing-indicator hidden"></div>

      <div class="input-bar">
        <input id="message-input" type="text" placeholder="Type a message..." maxlength="1000" autocomplete="off" />
        <button id="send-btn" class="btn-send" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
